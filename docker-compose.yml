version: '3.9'

services:
  minepanel:
    build: .
    container_name: minepanel
    restart: unless-stopped
    ports:
      - '3000:3000'   # Web UI
      - '3001:3001'   # Sidecar WebSocket
      - '25565:25565' # Default Minecraft port (adjust as needed)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data:/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SIDECAR_PORT=3001
      - DATA_DIR=/data
      - DATABASE_URL=/data/db/minepanel.db
      - BASE_PORT=25565
      - PORT_BLOCK_SIZE=10
    networks:
      - minepanel-net

  mc-router:
    image: itzg/mc-router:latest
    container_name: mc-router
    restart: unless-stopped
    ports:
      - '25565:25565'
    environment:
      - API_BINDING=:25564
      - ROUTES_CONFIG_WATCH=true
    volumes:
      - ./data/mc-router:/data
    networks:
      - minepanel-net

networks:
  minepanel-net:
    driver: bridge
